[workspace]
resolver = "2"
members = [
    "crates/coop-protocol",
    "crates/coop-net",
    "crates/coop-session",
    "crates/coop-sim",
    "crates/coop-dll",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
coop-protocol = { path = "crates/coop-protocol" }
coop-net = { path = "crates/coop-net" }
coop-session = { path = "crates/coop-session" }

[profile.release]
lto = true
codegen-units = 1
